[project]
name = "airflow-dags-poc"
version = "0.1.0"
description = ""
authors = [
    {name = "Stefan Aniff",email = "stefan.aniff@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.15.4,<0.16.0)",
    "jinja2 (>=3.1.6,<3.2.0)",
    "apache-airflow (>=2.10.0,<3.0.0)",
    "astronomer-cosmos (>=1.8.0,<2.0.0)",
    "dbt-postgres (>=1.9.0,<2.0.0)",
    "soda-core-postgres (>=3.5.6,<4.0.0)",
    "setuptools (>=82.0.1,<83.0.0)",
    "psycopg[binary] (>=3.1.0,<4.0.0)"
]

[tool.ruff.lint]
select = [
  "F",    # Pyflakes (logic issues)
  "E",    # pycodestyle (style errors)
  "W",    # pycodestyle (warnings, optional)
  "I",    # isort (import sorting)
  "B",    # flake8-bugbear (common bugs / anti-patterns)
  "ANN",  # flake8-annotations (type hint enforcement)
  "N",    # pep8-naming (naming conventions)
  "C4",   # flake8-comprehensions (inefficient comprehensions)
  "UP",   # pyupgrade (suggest newer Python syntax)
  "YTT",  # flake8-2020 (year 2020+ traps)
  "SIM",  # flake8-simplify (simplifiable code patterns)
]

ignore = [
  "D100",   # Missing docstring in public module
  "D102",   # Missing docstring in public method
  "D107",   # Missing docstring in __init__ method
]

per-file-ignores = { "tests/unit/**/*.py" = [
  "E501" # Allow long descriptive test function names
]}

[tool.pytest.ini_options]
pythonpath = ["dags"]
