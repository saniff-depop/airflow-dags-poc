version: 2

models:
  - name: met_team_season_summary
    description: "Pre-aggregated team performance per season. One row per team per season. Combines home and away matches into a single league-table view."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_id
            - season_id
    columns:
      - name: team_id
        description: "Foreign key to dim_team."
        tests:
          - not_null
      - name: season_id
        description: "Foreign key to dim_season."
        tests:
          - not_null
      - name: matches_played
        description: "Total matches played (home + away)."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: wins
        description: "Total wins (home + away)."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: draws
        description: "Total draws (home + away)."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: losses
        description: "Total losses (home + away)."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: goals_for
        description: "Total goals scored (home + away)."
      - name: goals_against
        description: "Total goals conceded (home + away)."
      - name: xg_for
        description: "Total expected goals for (home + away)."
      - name: xg_against
        description: "Total expected goals against (home + away)."
      - name: points
        description: "League points: wins * 3 + draws."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
